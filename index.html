<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ভয়েস ইনপুট</title>
<style>
  *{box-sizing:border-box}
  body{font-family:'Noto Sans Bengali',sans-serif;margin:0;padding:20px;text-align:center;background:#f5f7f6}
  h3{margin:0 0 10px}
  #st{min-height:56px;margin:10px 0;font-size:16px;word-break:break-word}
  button{font-size:17px;padding:12px 26px;border:0;border-radius:10px;color:#fff;background:#dc3545;cursor:pointer}
  #out{width:100%;height:100px;margin-top:10px;padding:8px;font-size:16px;display:none}
  .dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#dc3545;animation:p 1s infinite}
  @keyframes p{50%{opacity:.2}}
</style>
</head>
<body>
<h3>🎤 ভয়েস ইনপুট</h3>
<div id="st">লোড হচ্ছে...</div>
<button id="btn" style="display:none">⏹ থামুন ও লিখুন</button>
<textarea id="out" readonly></textarea>
<button id="copy" style="display:none;margin-top:8px;background:#198754">📋 কপি করুন</button>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzWHeKAG8lT-cNSGKZ_FWJDMnrtSaFGoGh5UJVj6mkW4r9aPTL-VaDGrxu4k4aI1SfhQw/exec';
const TOKEN = 'এখানে-আপনার-VOICE_TOKEN-বসান';

const st = document.getElementById('st');
const btn = document.getElementById('btn');
const out = document.getElementById('out');
const copyBtn = document.getElementById('copy');
const targetId = new URLSearchParams(location.search).get('target');
let rec = null, chunks = [], stream = null;

// যেকোনো এরর পেজেই দেখাবে
window.onerror = function (msg, src, line) { st.textContent = 'স্ক্রিপ্ট ত্রুটি: ' + msg + ' (লাইন ' + line + ')'; };
window.onunhandledrejection = function (e) { st.textContent = 'ত্রুটি: ' + (e.reason && e.reason.message || e.reason); };

async function start() {
  st.textContent = '🎤 মাইক চালু হচ্ছে... অনুমতি চাইলে Allow দিন।';
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    st.textContent = 'এই ব্রাউজারে মাইক সাপোর্ট নেই।';
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    st.innerHTML = 'মাইক অনুমতি পাওয়া যায়নি (' + e.name + ')।<br>অ্যাড্রেসবারের আইকন থেকে Microphone → Allow দিয়ে পেজ রিলোড করুন।';
    return;
  }
  rec = new MediaRecorder(stream);
  rec.ondataavailable = function (e) { if (e.data.size) chunks.push(e.data); };
  rec.onstop = finish;
  rec.start();
  st.innerHTML = '<span class="dot"></span> রেকর্ডিং চলছে... বলুন';
  btn.style.display = 'inline-block';
  setTimeout(function () { if (rec && rec.state === 'recording') rec.stop(); }, 60000);
}

btn.onclick = function () { if (rec && rec.state === 'recording') rec.stop(); };

async function finish() {
  stream.getTracks().forEach(function (t) { t.stop(); });
  btn.style.display = 'none';
  st.textContent = '⏳ যতিচিহ্ন সহ লেখা তৈরি হচ্ছে...';
  try {
    const blob = new Blob(chunks, { type: rec.mimeType });
    const audio = await blobToWavBase64(blob);
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ token: TOKEN, audio: audio, mime: 'audio/wav' })
    });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch (e) { throw new Error('সার্ভার JSON দেয়নি: ' + raw.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').slice(0, 300)); }
    if (!data.ok) throw new Error(data.error);
    if (!data.text) { st.textContent = 'কোনো কথা শনাক্ত হয়নি। উইন্ডো বন্ধ করে আবার চেষ্টা করুন।'; return; }

    let sent = false;
    try {
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage({ type: 'voice-text', targetId: targetId, text: data.text }, '*');
        sent = true;
      }
    } catch (e) {}

    if (sent) {
      st.textContent = '✅ হয়েছে';
      setTimeout(function () { window.close(); }, 500);
    } else {
      st.textContent = 'লেখা তৈরি হয়েছে। কপি করে ফিল্ডে পেস্ট করুন:';
      out.style.display = 'block'; out.value = data.text;
      copyBtn.style.display = 'inline-block';
      copyBtn.onclick = function () { out.select(); document.execCommand('copy'); copyBtn.textContent = '✅ কপি হয়েছে'; };
    }
  } catch (e) {
    st.textContent = 'ত্রুটি: ' + (e.message || e);
  }
}

async function blobToWavBase64(blob) {
  const ab = await blob.arrayBuffer();
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const decoded = await ctx.decodeAudioData(ab);
  ctx.close();
  const sr = 16000;
  const off = new OfflineAudioContext(1, Math.ceil(decoded.duration * sr), sr);
  const src = off.createBufferSource();
  src.buffer = decoded; src.connect(off.destination); src.start();
  const samples = (await off.startRendering()).getChannelData(0);

  const buf = new ArrayBuffer(44 + samples.length * 2);
  const v = new DataView(buf);
  const w = function (o, s) { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true);
  w(8, 'WAVE'); w(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, 'data'); v.setUint32(40, samples.length * 2, true);
  let o = 44;
  for (let i = 0; i < samples.length; i++, o += 2) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    v.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  let bin = '';
  const bytes = new Uint8Array(buf);
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

start();
</script>
</body>
</html>
